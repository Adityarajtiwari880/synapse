<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07080f" />
    </radialGradient>

    <!-- Top Specular Glass Sheen -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Layer 1 Gradient (Cyan - Blue) -->
    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Layer 2 Gradient (Blue - Indigo) -->
    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Layer 3 Gradient (Indigo - Purple) -->
    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="url(#glassRim)" stroke-width="4" />

  <!-- Center Layered Documents / Spatial Synapse Layers -->
  <g transform="translate(256, 256) rotate(-14) translate(-256, -256)" filter="url(#glow)">
    <!-- Bottom Layer (Purple) -->
    <rect x="116" y="270" width="280" height="96" rx="24" fill="url(#layer3Grad)" fill-opacity="0.8" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />
    
    <!-- Middle Layer (Indigo) -->
    <rect x="136" y="208" width="280" height="96" rx="24" fill="url(#layer2Grad)" fill-opacity="0.88" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.45" />

    <!-- Top Layer (Cyan-Blue) -->
    <rect x="156" y="146" width="280" height="96" rx="24" fill="url(#layer1Grad)" fill-opacity="0.95" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6" />

    <!-- Specular Reflection Highlight -->
    <line x1="180" y1="160" x2="410" y2="160" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75" />
  </g>
</svg>
