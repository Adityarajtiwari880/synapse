<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Title & SEO -->
    <title>Synapse — Spatial Research Workspace</title>
    <meta name="description" content="Next-generation spatial reading, document synthesis, and visual knowledge workspace for iPad, Mac, and PC." />

    <!-- Synchronous Polyfills for Older iPads & WebKit Browsers (iOS 12-17) -->
    <script>
      (function() {
        // 1. globalThis polyfill (iOS < 12.2)
        if (typeof globalThis === 'undefined') {
          if (typeof self !== 'undefined') { self.globalThis = self; }
          else if (typeof window !== 'undefined') { window.globalThis = window; }
        }

        // 2. Promise.withResolvers polyfill (iOS / Safari < 17.4)
        if (typeof Promise.withResolvers !== 'function') {
          Promise.withResolvers = function() {
            var resolve, reject;
            var promise = new Promise(function(res, rej) {
              resolve = res;
              reject = rej;
            });
            return { promise: promise, resolve: resolve, reject: reject };
          };
        }

        // 3. Array.prototype.at & String.prototype.at (iOS < 15.4)
        if (!Array.prototype.at) {
          Array.prototype.at = function(n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            if (n < 0 || n >= this.length) return undefined;
            return this[n];
          };
        }
        if (!String.prototype.at) {
          String.prototype.at = function(n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            if (n < 0 || n >= this.length) return undefined;
            return this[n];
          };
        }

        // 4. Object.hasOwn (iOS < 15.4)
        if (!Object.hasOwn) {
          Object.hasOwn = function(obj, prop) {
            return Object.prototype.hasOwnProperty.call(obj, prop);
          };
        }

        // 5. crypto.randomUUID (iOS < 15.4)
        if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
          crypto.randomUUID = function() {
            return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function(c) {
              return (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16);
            });
          };
        }

        // 6. structuredClone (iOS < 15.4)
        if (typeof window.structuredClone !== 'function') {
          window.structuredClone = function(obj) {
            try { return JSON.parse(JSON.stringify(obj)); } catch (e) { return obj; }
          };
        }

        // 7. Global unhandled error failsafe to prevent permanent black screen on older iPads
        window.addEventListener('error', function(e) {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0)) {
            root.innerHTML = '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#0c0d14;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;text-align:center;">' +
              '<div style="max-width:400px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);padding:28px;border-radius:24px;backdrop-filter:blur(20px);">' +
                '<div style="font-size:32px;margin-bottom:12px;">📱</div>' +
                '<h2 style="font-size:18px;font-weight:700;margin-bottom:8px;">iPad Compatibility Initializer</h2>' +
                '<p style="font-size:13px;color:#94a3b8;line-height:1.5;margin-bottom:20px;">' +
                  'Synapse loaded compatibility shims for your iPadOS version. Tap below to launch your workspace.' +
                '</p>' +
                '<button onclick="window.location.reload();" style="background:#3b82f6;color:white;border:none;padding:12px 24px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(59,130,246,0.4);">' +
                  'Launch Workspace' +
                '</button>' +
              '</div>' +
            '</div>';
          }
        });
      })();
    </script>

    <!-- Favicons & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple iOS / iPadOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Synapse" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0c0d14" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body class="h-screen w-screen overflow-hidden text-slate-100 bg-[#0c0d14] font-sans select-none antialiased">
    <div id="root" class="h-full w-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
